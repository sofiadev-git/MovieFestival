<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title th:text="|Recensione · Moviola|">
   Recensione · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('films')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Film / Recensione')}">
    </header>
    <main class="page-content">
     <div class="form-card">
      <p class="eyebrow">
       La tua voce
      </p>
      <h1 class="serif" th:text="${modifica} ? 'Modifica recensione' : 'Scrivi una recensione'">
       Recensione
      </h1>
      <p class="lead">
       Film:
       <strong th:text="${film.titolo}">
        Titolo film
       </strong>
      </p>
      <form method="post" th:action="${modifica} ? @{/recensioni/{id}(id=${recensione.id})} : @{/films/{filmId}/recensioni(filmId=${film.id})}" th:object="${recensione}">
       <div class="form-fields">
        <div class="field wide">
         <label for="voto">
          Il tuo voto
         </label>
         <select id="voto" required="" th:field="*{voto}">
          <option value="">
           Seleziona un voto
          </option>
          <option th:each="i : ${#numbers.sequence(1,5)}" th:text="|${i} / 5|" th:value="${i}">
           Voto
          </option>
         </select>
         <small class="field-error" th:errors="*{voto}" th:if="${#fields.hasErrors('voto')}">
         </small>
        </div>
        <div class="field wide">
         <label for="testo">
          La tua recensione
         </label>
         <textarea id="testo" maxlength="500" required="" th:field="*{testo}"></textarea>
         <small class="field-error" th:errors="*{testo}" th:if="${#fields.hasErrors('testo')}">
         </small>
        </div>
       </div>
       <div class="form-actions">
        <a class="button" th:href="@{/films/{id}(id=${film.id})}">
         Annulla
        </a>
        <button class="button primary" th:text="${modifica} ? 'Aggiorna recensione' : 'Pubblica recensione'">
         Pubblica
        </button>
       </div>
      </form>
     </div>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
