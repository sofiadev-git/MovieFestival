<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title><link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar"><a th:href="@{/}"><strong>Movie Festival</strong></a><a th:href="@{/festivals}">Festival</a></nav>
<main class="container"><section class="panel" style="max-width:520px;margin:auto">
    <h1>Login</h1>
    <p class="success" th:if="${param.registered}">Registrazione completata. Ora puoi accedere.</p>
    <p class="error" th:if="${param.error}">Username o password non corretti.</p>
    <p class="success" th:if="${param.logout}">Logout effettuato.</p>
    <form class="form-grid" th:action="@{/login}" method="post">
        <label>Username<input type="text" name="username" required></label>
        <label>Password<input type="password" name="password" required></label>
        <button type="submit">Accedi</button>
    </form>
    <p>Non hai un account? <a th:href="@{/register}">Registrati</a></p>
</section></main>
</body>
</html>
