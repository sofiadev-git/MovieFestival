<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title th:text="|Accedi · Moviola|">
   Accedi · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('home')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Il tuo account')}">
    </header>
    <main class="page-content">
     <div class="auth-wrap">
      <section class="auth-card">
       <p class="eyebrow">
        Bentornato su Moviola
       </p>
       <h1 class="serif">
        Ci rivediamo al cinema.
       </h1>
       <p class="hint">
        Accedi per scrivere recensioni e partecipare alla conversazione.
       </p>
       <p class="success" th:if="${param.registered}">
        Registrazione completata. Ora puoi accedere.
       </p>
       <p class="error" th:if="${param.error}">
        Credenziali non valide. Riprova.
       </p>
       <p class="success" th:if="${param.logout}">
        Hai effettuato la disconnessione.
       </p>
       <form method="post" th:action="@{/login}">
        <div class="field">
         <label for="username">
          Username
         </label>
         <input autocomplete="username" id="username" name="username" required=""/>
        </div>
        <div class="field">
         <label for="password">
          Password
         </label>
         <input autocomplete="current-password" id="password" name="password" required="" type="password"/>
        </div>
        <button class="button primary">
         Accedi
        </button>
       </form>
       <p class="hint" style="margin:22px 0 0">
        Non hai un account?
        <a style="color:var(--red)" th:href="@{/register}">
         Registrati
        </a>
       </p>
      </section>
     </div>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
