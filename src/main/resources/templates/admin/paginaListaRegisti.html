<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Gestione registi</title>

  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar">

  <a th:href="@{/static}">
    <strong>Movie Festival</strong>
  </a>

  <a th:href="@{/templates/admin}">
    Area Admin
  </a>

</nav>


<main class="container">

  <div class="space-between">

    <div>
      <p class="muted">Area amministratore</p>
      <h1>Registi</h1>
    </div>

    <a class="button-link"
       th:href="@{/admin/registi/nuovo}">
      Aggiungi regista
    </a>

  </div>


  <div th:if="${#lists.isEmpty(registi)}"
       class="panel">

    <p>Non ci sono registi.</p>

  </div>


  <section class="registi-grid">

    <article class="regista-card"
             th:each="regista : ${registi}">

      <h2>
        <span th:text="${regista.nome}"></span>
        <span th:text="${regista.cognome}"></span>
      </h2>

      <div class="regista-info">

        <p>
          <strong>Nazionalità:</strong>
          <span th:text="${regista.nazionalita}"></span>
        </p>

        <p>
          <strong>Data di nascita:</strong>
          <span th:text="${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}"></span>
        </p>

      </div>


      <div class="regista-actions">

        <a class="button-link"
           th:href="@{/admin/registi/{id}/edit(id=${regista.id})}">
          Modifica
        </a>

        <form th:action="@{/admin/registi/{id}/delete(id=${regista.id})}"
              method="post">

          <button type="submit">
            Elimina
          </button>

        </form>

      </div>

    </article>

  </section>

</main>

</body>

</html>
