<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title th:text="|Sala · Moviola|">
   Sala · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('admin-sale')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Amministrazione / Sala')}">
    </header>
    <main class="page-content">
     <div class="form-card">
      <p class="eyebrow">
       Amministrazione / Catalogo
      </p>
      <h1 class="serif" th:text="${modifica} ? 'Modifica sala' : 'Nuova sala'">
       Sala
      </h1>
      <p class="lead">
       Compila i dati qui sotto. Le modifiche saranno salvate nel catalogo Moviola.
      </p>
      <p class="error" th:if="${error}" th:text="${error}">
       Errore
      </p>
      <form method="post" th:action="${modifica} ? @{/admin/sale/{id}(id=${sala.id})} : @{/admin/sale}" th:object="${sala}">
       <div class="form-fields">
        <div class="field">
         <label for="nome">
          Nome sala
         </label>
         <input id="nome" required="" th:field="*{nome}"/>
        </div>
        <div class="field">
         <label for="indirizzo">
          Indirizzo
         </label>
         <input id="indirizzo" required="" th:field="*{indirizzo}"/>
        </div>
        <div class="field">
         <label for="capienza">
          Capienza (posti)
         </label>
         <input id="capienza" min="1" required="" th:field="*{capienza}" type="number"/>
        </div>
       </div>
       <div class="form-actions">
        <a class="button" th:href="@{/admin/sale}">
         Annulla
        </a>
        <button class="button primary" th:text="${modifica} ? 'Salva modifiche' : 'Crea sala'" type="submit">
         Salva
        </button>
       </div>
      </form>
     </div>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
