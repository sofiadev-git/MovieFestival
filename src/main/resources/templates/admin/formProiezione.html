<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title th:text="|Proiezione · Moviola|">
   Proiezione · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('dashboard')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Amministrazione / Proiezione')}">
    </header>
    <main class="page-content">
     <div class="form-card">
      <p class="eyebrow">
       Programmazione ·
       <span th:text="${festival.nome}">
        Festival
       </span>
      </p>
      <h1 class="serif" th:text="${modifica} ? 'Modifica proiezione' : 'Nuova proiezione'">
       Proiezione
      </h1>
      <p class="lead">
       Programma una proiezione per un film già associato al festival. Le sale non possono sovrapporsi temporalmente.
      </p>
      <p class="error" th:if="${error}" th:text="${error}">
       Errore
      </p>
      <div class="empty" th:if="${#lists.isEmpty(sale)}">
       Non ci sono sale disponibili.
       <a th:href="@{/admin/sale/nuova}">
        Crea una sala prima di programmare.
       </a>
      </div>
      <form method="post" th:action="${modifica} ? @{/admin/festivals/{festivalId}/proiezioni/{id}(festivalId=${festival.id},id=${proiezione.id})} : @{/admin/festivals/{festivalId}/films/{filmId}/proiezioni(festivalId=${festival.id},filmId=${film.id})}" th:object="${proiezione}" th:unless="${#lists.isEmpty(sale)}">
       <div class="form-fields">
        <div class="field">
         <label for="film">
          Film
         </label>
         <input id="film" readonly="" th:value="${film.titolo}" type="text"/>
        </div>
        <div class="field">
         <label for="salaId">
          Sala
         </label>
         <select id="salaId" name="salaId" required="">
          <option value="">
           Scegli una sala
          </option>
          <option th:each="sala : ${sale}" th:selected="${salaId != null and sala.id == salaId}" th:text="|${sala.nome} · ${sala.indirizzo}|" th:value="${sala.id}">
           Sala
          </option>
         </select>
        </div>
        <div class="field">
         <label for="data">
          Data
         </label>
         <select id="data" required="" th:field="*{data}">
          <option value="">
           Scegli un giorno
          </option>
          <option th:each="giorno : ${giorniFestival}" th:text="${#temporals.format(giorno,'dd/MM/yyyy')}" th:value="${giorno}">
           Data
          </option>
         </select>
        </div>
        <div class="field">
         <label for="ora">
          Ora
         </label>
         <input id="ora" required="" th:field="*{ora}" type="time"/>
        </div>
        <div class="field wide" th:if="${modifica}">
         <label for="stato">
          Stato proiezione
         </label>
         <select id="stato" required="" th:field="*{stato}">
          <option value="SCHEDULED">
           Programmata
          </option>
          <option value="COMPLETED">
           Completata
          </option>
          <option value="CANCELLED">
           Annullata
          </option>
         </select>
        </div>
       </div>
       <div class="form-actions">
        <a class="button" th:href="@{/admin/festivals/{festivalId}/proiezioni(festivalId=${festival.id})}">
         Annulla
        </a>
        <button class="button primary" th:text="${modifica} ? 'Salva modifiche' : 'Programma proiezione'">
         Salva
        </button>
       </div>
      </form>
     </div>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
