<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="${modifica} ? 'Modifica film' : 'Nuovo film'">
        Film
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">Movie Festival</a>
    <div class="nav-links">
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/films}">Film</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/admin}">Area Admin</a>
        <form th:action="@{/logout}" method="post">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </div>
</nav>

<main class="container">

    <section class="panel">

        <h1 th:text="${modifica} ? 'Modifica film' : 'Nuovo film'">
            Film
        </h1>

        <form class="admin-form"
              th:object="${film}"
              th:action="${modifica}
                    ? @{/admin/films/{id}(id=${film.id})}
                    : @{/admin/films}"
              method="post"
              enctype="multipart/form-data">

            <div class="form-field">
                <label for="titolo">Titolo</label>
                <input id="titolo"
                       type="text"
                       th:field="*{titolo}"
                       required>
            </div>

            <div class="form-field">
                <label for="anno">Anno</label>
                <input id="anno"
                       type="number"
                       th:field="*{anno}"
                       min="1900"
                       max="2030"
                       required>
            </div>

            <div class="form-field">
                <label for="durata">Durata (minuti)</label>
                <input id="durata"
                       type="number"
                       th:field="*{durata}"
                       min="1">
            </div>

            <div class="form-field">
                <label for="genere">Genere</label>
                <input id="genere"
                       type="text"
                       th:field="*{genere}">
            </div>

            <div class="form-field">
                <label for="paeseProduzione">Paese di produzione</label>
                <input id="paeseProduzione"
                       type="text"
                       th:field="*{paeseProduzione}">
            </div>

            <div class="form-field">
                <label for="registaId">Regista</label>
                <select id="registaId"
                        name="registaId"
                        required>
                    <option value="">Seleziona un regista</option>

                    <option th:each="regista : ${registi}"
                            th:value="${regista.id}"
                            th:text="|${regista.nome} ${regista.cognome}|"
                            th:selected="${film.regista != null and film.regista.id == regista.id}">
                    </option>
                </select>
            </div>

            <div class="form-field">
                <label for="fileLocandina">Locandina</label>

                <input id="fileLocandina"
                       type="file"
                       name="fileLocandina"
                       accept="image/*">

                <div th:if="${modifica and film.locandina != null and !film.locandina.isBlank()}">
                    <p>Locandina attuale:</p>

                    <img th:src="${film.locandina}"
                         th:alt="|Locandina di ${film.titolo}|">
                </div>
            </div>

            <div class="form-actions">
                <a class="button outline" th:href="@{/films}">Annulla</a>
                <button class="button accent" type="submit"
                        th:text="${modifica} ? 'Salva modifiche' : 'Crea film'">
                    Salva
                </button>
            </div>

        </form>

    </section>

</main>

</body>
</html>
