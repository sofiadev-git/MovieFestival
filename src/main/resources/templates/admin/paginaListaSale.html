<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Gestisci sale · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('admin-sale')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Amministrazione / Sale')}">
    </header>
    <main class="page-content">
     <header class="ad-list-head">
      <div>
       <p class="eyebrow">
        AMMINISTRAZIONE / LUOGHI
       </p>
       <h1>
        Le sale
       </h1>
       <p>
        Elenco delle sale disponibili per le proiezioni cinematografiche.
       </p>
      </div>
      <a class="btn red" th:href="@{/admin/sale/nuova}">
       + Nuova sala
      </a>
     </header>
     <p class="error" th:if="${error}" th:text="${error}">
     </p>
     <div class="ad-filter-bar">
      <label class="ad-search-label" for="saleSearch">
       Cerca
      </label>
      <input class="form-control" data-admin-search="" id="saleSearch" placeholder="Nome o indirizzo..." type="search"/>
      <span class="ad-result-count" data-admin-count="">
      </span>
     </div>
     <div class="table-scroll ad-table-scroll">
      <table class="manage-table">
       <thead>
        <tr>
         <th>
          Sala
         </th>
         <th>
          Indirizzo
         </th>
         <th>
          Capienza
         </th>
         <th>
          Azioni
         </th>
        </tr>
       </thead>
       <tbody>
        <tr data-admin-row="" th:each="sala : ${sale}">
         <td>
          <strong th:text="${sala.nome}">
           Sala
          </strong>
         </td>
         <td th:text="${sala.indirizzo}">
          Indirizzo
         </td>
         <td th:text="|${sala.capienza} posti|">
          Posti
         </td>
         <td class="ad-row-actions">
          <a class="table-action" th:href="@{/admin/sale/{id}/edit(id=${sala.id})}">
           Modifica
          </a>
          <form class="ad-inline-form" data-confirm="Eliminare questa sala?" method="post" th:action="@{/admin/sale/{id}/delete(id=${sala.id})}">
           <button class="table-action ad-delete" type="submit">
            Elimina
           </button>
          </form>
         </td>
        </tr>
       </tbody>
      </table>
     </div>
     <p class="ad-empty" data-admin-empty="" hidden="">
      Nessuna sala corrisponde alla ricerca.
     </p>
     <p class="ad-empty" th:if="${#lists.isEmpty(sale)}">
      Nessuna sala presente. Puoi crearne una dal pulsante «Nuova sala».
     </p>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
