<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${modifica} ? 'Modifica regista' : 'Nuovo regista'">Regista</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body class="festival-page">

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">Movie Festival</a>
    <div class="nav-links">
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/films}">Film</a>
        <a th:href="@{/registi}">Registi</a>
        <a th:href="@{/admin}">Area Admin</a>
        <form th:action="@{/logout}" method="post">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </div>
</nav>

<main class="form-page">
    <section class="form-card">
        <header class="form-heading">
            <p class="section-kicker">AREA AMMINISTRATORE</p>
            <h1 th:text="${modifica} ? 'Modifica regista' : 'Nuovo regista'">Regista</h1>
        </header>

        <p class="error" th:if="${error}" th:text="${error}">Errore</p>

        <form class="admin-form"
              th:object="${regista}"
              th:action="${modifica}
                    ? @{/admin/registi/{id}(id=${regista.id})}
                    : @{/admin/registi}"
              method="post">

            <div class="form-grid two">
                <div class="form-field">
                    <label for="nome">Nome</label>
                    <input id="nome" type="text" th:field="*{nome}" required>
                </div>

                <div class="form-field">
                    <label for="cognome">Cognome</label>
                    <input id="cognome" type="text" th:field="*{cognome}" required>
                </div>

                <div class="form-field">
                    <label for="nazionalita">Nazionalità</label>
                    <input id="nazionalita" type="text" th:field="*{nazionalita}" required>
                </div>

                <div class="form-field">
                    <label for="dataNascita">Data di nascita</label>
                    <input id="dataNascita" type="date" th:field="*{dataNascita}" min="1800-01-01" required>
                </div>
            </div>

            <div class="form-actions">
                <a class="button outline" th:href="@{/registi}">Annulla</a>
                <button class="button accent" type="submit"
                        th:text="${modifica} ? 'Salva modifiche' : 'Crea regista'">Salva</button>
            </div>
        </form>
    </section>
</main>

</body>
</html>
