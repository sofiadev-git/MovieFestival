<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title th:text="|Registrati · Moviola|">
   Registrati · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('home')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Il tuo account')}">
    </header>
    <main class="page-content">
     <div class="auth-wrap">
      <section class="auth-card">
       <p class="eyebrow">
        Entra nella community
       </p>
       <h1 class="serif">
        Ogni opinione conta.
       </h1>
       <p class="hint">
        Crea il tuo account e comincia a recensire i film.
       </p>
       <p class="error" th:if="${error}" th:text="${error}">
        Errore
       </p>
       <form method="post" th:action="@{/register}">
        <div class="field">
         <label for="username">
          Username
         </label>
         <input autocomplete="username" id="username" name="username" required="" th:value="${username}"/>
        </div>
        <div class="field">
         <label for="password">
          Password
         </label>
         <input autocomplete="new-password" id="password" name="password" required="" type="password"/>
        </div>
        <div class="field">
         <label for="confirmPassword">
          Conferma password
         </label>
         <input autocomplete="new-password" id="confirmPassword" name="confirmPassword" required="" type="password"/>
        </div>
        <button class="button primary">
         Crea account
        </button>
       </form>
       <p class="hint" style="margin:22px 0 0">
        Sei già registrato?
        <a style="color:var(--red)" th:href="@{/login}">
         Accedi
        </a>
       </p>
      </section>
     </div>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
