<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title th:text="|Registi · Moviola|">
   Registi · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('registi')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Catalogo / Registi')}">
    </header>
    <main class="page-content">
     <header class="page-heading">
      <div>
       <p class="eyebrow">
        Dietro la macchina da presa
       </p>
       <h1 class="serif">
        Gli occhi che raccontano.
       </h1>
       <p class="intro">
        Scopri chi ha diretto le storie del nostro catalogo.
       </p>
      </div>
      <a class="button primary" th:href="@{/admin/registi/nuovo}" th:if="${navAdmin}">
       + Nuovo regista
      </a>
     </header>
     <div class="catalog-controls">
      <input aria-label="Cerca registi" class="search-field" data-filter-input="" placeholder="Cerca un regista o una nazionalità…" type="search"/>
      <span class="count-tag" th:text="|${#lists.size(registi)} registi|">
       Registi
      </span>
     </div>
     <div class="festival-grid">
      <article class="festival-card" th:attr="data-search=|${regista.nome} ${regista.cognome} ${regista.nazionalita}|" th:each="regista : ${registi}">
       <a class="stretched" th:href="@{/registi/{id}(id=${regista.id})}">
       </a>
       <span class="eyeline" th:text="${regista.nazionalita}">
        Nazionalità
       </span>
       <h2 class="serif" th:text="|${regista.nome} ${regista.cognome}|">
        Regista
       </h2>
       <p>
        <span class="data-label">
         Nascita
        </span>
        <span th:text="${#temporals.format(regista.dataNascita,'dd/MM/yyyy')}">
         Data
        </span>
       </p>
       <div class="card-foot">
        <small>
         Scopri la filmografia ↗
        </small>
        <div class="row-actions" th:if="${navAdmin}">
         <a class="button small" th:href="@{/admin/registi/{id}/edit(id=${regista.id})}">
          Modifica
         </a>
        </div>
       </div>
      </article>
     </div>
     <div class="empty no-results" data-filter-empty="">
      Nessun regista corrisponde alla ricerca.
     </div>
     <div class="empty" th:if="${#lists.isEmpty(registi)}">
      Non ci sono ancora registi nel catalogo.
     </div>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
