<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registi - Movie Festival</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="festival-page">

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}">Movie Festival</a>
    <div class="nav-links">
        <a th:href="@{/festivals}">Festival</a>
        <a th:href="@{/films}">Film</a>
        <span class="nav-current">Registi</span>
        <a th:if="${isAdmin}" th:href="@{/admin}">Area Admin</a>

        <a th:if="${userDetails == null}" th:href="@{/login}">Login</a>
        <a th:if="${userDetails == null}" class="nav-register" th:href="@{/register}">Sign up</a>

        <span class="nav-user"
              th:if="${userDetails != null}"
              th:text="${userDetails.username}">username</span>

        <form th:if="${userDetails != null}" th:action="@{/logout}" method="post">
            <button class="nav-button" type="submit">Logout</button>
        </form>
    </div>
</nav>

<main class="site-container">
    <header class="section-header">
        <div>
            <p class="section-kicker">CATALOGO</p>
            <h1>REGISTI</h1>
        </div>
        <a class="button accent"
           th:if="${isAdmin}"
           th:href="@{/admin/registi/nuovo}">+ Aggiungi regista</a>
    </header>

    <section class="empty-state-dark" th:if="${#lists.isEmpty(registi)}">
        <h2>Nessun regista presente</h2>
        <p>Non sono ancora presenti registi nel catalogo.</p>
    </section>

    <section class="entity-grid" th:unless="${#lists.isEmpty(registi)}">
        <article class="entity-card" th:each="regista : ${registi}">
            <a class="entity-card-main" th:href="@{/registi/{id}(id=${regista.id})}">
                <div class="entity-card-header">
                    <div class="avatar"
                         th:text="|${#strings.substring(regista.nome,0,1)}${#strings.substring(regista.cognome,0,1)}|">MR</div>
                    <div>
                        <h2 th:text="|${regista.nome} ${regista.cognome}|">Mario Rossi</h2>
                        <span class="muted" th:text="${regista.nazionalita}">Italiana</span>
                    </div>
                </div>

                <dl class="details-list">
                    <div>
                        <dt>Data di nascita</dt>
                        <dd th:text="${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}">01/01/1980</dd>
                    </div>
                </dl>
            </a>

            <div class="card-actions" th:if="${isAdmin}">
                <a class="button secondary" th:href="@{/admin/registi/{id}/edit(id=${regista.id})}">Modifica</a>
                <form th:action="@{/admin/registi/{id}/delete(id=${regista.id})}" method="post">
                    <button class="button danger" type="submit">Elimina</button>
                </form>
            </div>
        </article>
    </section>
</main>

</body>
</html>
