<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title th:text="|Regista · Moviola|">
   Regista · Moviola
  </title>
  <link rel="stylesheet" th:href="@{/css/moviola.css}"/>
  <script defer="" th:src="@{/js/moviola.js}">
  </script>
 </head>
 <body>
  <div class="layout">
   <aside th:replace="~{fragments/shell :: sidebar('registi')}">
   </aside>
   <div class="workspace">
    <header th:replace="~{fragments/shell :: topbar('Registi / Dettaglio')}">
    </header>
    <main class="page-content">
     <section class="detail-hero" style="grid-template-columns:180px 1fr">
      <div class="avatar" style="width:170px;height:170px;border-radius:30px;font-size:66px">
       ✦
      </div>
      <div>
       <p class="eyebrow">
        Regista · Profilo
       </p>
       <h1 class="serif" th:text="|${regista.nome} ${regista.cognome}|">
        Nome e cognome
       </h1>
       <div class="metric-line">
        <span th:text="${regista.nazionalita}">
         Nazionalità
        </span>
        <span th:text="|Nato il ${#temporals.format(regista.dataNascita,'dd/MM/yyyy')}|">
         Data
        </span>
       </div>
       <div class="actions">
        <a class="button" th:href="@{/registi}">
         ← Tutti i registi
        </a>
        <a class="button primary" th:href="@{/admin/registi/{id}/edit(id=${regista.id})}" th:if="${navAdmin}">
         Modifica regista
        </a>
        <form data-confirm="Eliminare questo regista?" method="post" th:action="@{/admin/registi/{id}/delete(id=${regista.id})}" th:if="${navAdmin}">
         <button class="button danger">
          Elimina
         </button>
        </form>
       </div>
      </div>
     </section>
     <div class="section-head">
      <div>
       <p class="eyebrow">
        La filmografia
       </p>
       <h2>
        Film diretti
       </h2>
      </div>
     </div>
     <div class="poster-grid">
      <article class="poster-card" th:each="film : ${regista.filmDiretti}">
       <a th:href="@{/films/{id}(id=${film.id})}">
        <div class="poster-art">
         <img th:alt="|Locandina di ${film.titolo}|" th:if="${film.locandina != null and !film.locandina.isBlank()}" th:src="${film.locandina}"/>
         <span class="poster-placeholder" th:if="${film.locandina == null or film.locandina.isBlank()}" th:text="${film.titolo}">
          Cinema
         </span>
        </div>
       </a>
       <div class="poster-meta">
        <h3>
         <a th:href="@{/films/{id}(id=${film.id})}" th:text="${film.titolo}">
          Titolo
         </a>
        </h3>
        <p th:text="|${film.genere} · ${film.anno}|">
        </p>
       </div>
      </article>
     </div>
     <div class="empty" th:if="${(regista.filmDiretti == null or regista.filmDiretti.isEmpty())}">
      Nessun film associato a questo regista.
     </div>
     <footer th:replace="~{fragments/shell :: footer}">
     </footer>
    </main>
   </div>
  </div>
 </body>
</html>
